<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Посылки - Отслеживание Заказов</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Subtle animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-slate-800 bg-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Sticky Glass Header -->
    <header class="sticky top-0 z-30 glass-header border-b border-slate-200/80 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-emerald-600 to-teal-500 text-white rounded-xl flex items-center justify-center shadow-md shadow-emerald-500/20 text-lg">
                    <i class="fa-solid fa-box-archive"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight leading-none">Мои Посылки</h1>
                    <p class="text-xs text-slate-500 font-medium mt-1">Трекер заказов и доставок</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-5">

        <!-- Quick Stats Cards Row -->
        <div class="grid grid-cols-3 gap-2.5 sm:gap-4">
            <div class="bg-white rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs flex items-center gap-3">
                <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center text-base sm:text-lg shrink-0">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-slate-500">Всего</div>
                    <div id="stat-total" class="text-base sm:text-xl font-bold text-slate-900">0</div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs flex items-center gap-3">
                <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-base sm:text-lg shrink-0">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-amber-600">В пути</div>
                    <div id="stat-transit" class="text-base sm:text-xl font-bold text-slate-900">0</div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs flex items-center gap-3">
                <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-base sm:text-lg shrink-0">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-emerald-600">Доставлено</div>
                    <div id="stat-delivered" class="text-base sm:text-xl font-bold text-slate-900">0</div>
                </div>
            </div>
        </div>

        <!-- Search and Filter Bar -->
        <div class="bg-white rounded-2xl p-3.5 sm:p-4 shadow-xs border border-slate-200/80 space-y-3">
            <!-- Search Bar Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderOrders()" 
                       placeholder="Поиск по товарам, магазину или трек-номеру..." 
                       class="w-full pl-9 pr-9 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white focus:ring-2 focus:ring-emerald-500/20 transition">
                <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- Filters Area -->
            <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100">
                <!-- Status Tabs -->
                <div class="flex flex-wrap gap-1.5" id="filterTabs">
                    <button onclick="setStatusFilter('all')" id="filter-all" class="filter-btn active px-3 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 bg-emerald-600 text-white shadow-xs">
                        Все (<span id="count-all">0</span>)
                    </button>
                    <button onclick="setStatusFilter('transit')" id="filter-transit" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200">
                        🚚 В пути (<span id="count-transit">0</span>)
                    </button>
                    <button onclick="setStatusFilter('delivered')" id="filter-delivered" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200">
                        ✅ Доставлено (<span id="count-delivered">0</span>)
                    </button>
                </div>

                <!-- Store Selector Filter -->
                <div class="flex items-center gap-1 text-xs">
                    <span class="text-slate-400 hidden sm:inline">Магазин:</span>
                    <select id="storeFilter" onchange="renderOrders()" class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs font-semibold text-slate-700 focus:outline-none focus:border-emerald-500">
                        <option value="all">Все магазины</option>
                        <option value="temu">Temu</option>
                        <option value="ali">AliExpress</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Order List Container -->
        <div id="ordersContainer" class="space-y-4">
            <!-- Dynamic Cards Rendered Here -->
        </div>

        <!-- Empty State Container -->
        <div id="emptyState" class="hidden bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-xs my-6">
            <div class="w-14 h-14 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-800 mb-1">Ничего не найдено</h3>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">По вашему запросу посылок не обнаружено.</p>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed bottom-5 right-5 z-50 hidden bg-slate-900 text-white text-xs font-medium py-3 px-4 rounded-xl shadow-xl flex items-center gap-2.5 animate-fade-in border border-slate-800">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastMessage">Уведомление</span>
    </div>

    <!-- Modal for Adding New Package -->
    <div id="addModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 space-y-4 animate-fade-in">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-base">Добавить новую посылку</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <form id="addPackageForm" onsubmit="handleAddPackage(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Название товаров *</label>
                    <input type="text" id="newTitle" required placeholder="Например: Набор воска и формы" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Подробности / состав</label>
                    <textarea id="newDescription" rows="2" placeholder="Краткое описание содержимого..." class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Магазин</label>
                        <select id="newStore" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500">
                            <option value="Temu / Почта">Temu / Почта</option>
                            <option value="Temu">Temu</option>
                            <option value="AliExpress / Почта">AliExpress / Почта</option>
                            <option value="AliExpress">AliExpress</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Дата заказа</label>
                        <input type="text" id="newOrderDate" placeholder="19.09.2026" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Трек-номер *</label>
                        <input type="text" id="newTracking" required placeholder="RU000000000Z5" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 font-mono">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Статус</label>
                        <select id="newStatus" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500">
                            <option value="transit">В пути</option>
                            <option value="delivered">Доставлено</option>
                        </select>
                    </div>
                </div>

                <div class="pt-3 flex gap-2 justify-end">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold">Отмена</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold shadow-sm">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-4 py-6 text-center text-slate-400 text-xs">
        <p>Мои Посылки &copy; 2026 • Удобный трекинг покупок</p>
    </footer>

    <script>
        // Initial Dataset
        const defaultOrders = [
            {
                id: '8',
                title: 'Черный и белый агат, натуральный жемчуг и граненые бусины',
                description: 'Черный агат (4мм), граненый «черный рис», матовый белый агат (6мм), пресноводный жемчуг (монеты, 4-5мм, 4мм, пластины) и 10 нитей черных глянцевых бусин (4мм)',
                store: 'Temu',
                trackingNumber: 'PO-097-07063848643193049',
                orderDate: '22.09.2026',
                expectedDate: 'В пути (ожидается трек-номер)',
                status: 'transit',
                icon: 'fa-gem',
                progressStep: 1
            },
            {
                id: '7',
                title: 'Набор бусин из натуральных камней и 3D Маркеры',
                description: 'Розовый нефрит, фиолетовый ангелит халцедон (4мм & 6мм), лаванда аметист (6мм), аметистовые бусины (4мм & 6мм) и набор 3D маркеров (24 цвета)',
                store: 'Temu / Почта',
                trackingNumber: 'RU002936565Z5',
                orderDate: '19.09.2026',
                expectedDate: 'В пути в вашу страну',
                status: 'transit',
                icon: 'fa-gem',
                progressStep: 2
            },
            {
                id: '6',
                title: 'Желейный воск, глицерин, лак для свечей и косметика',
                description: 'Желейный воск (200г), растительный глицерин (2x118 мл), глянцевый лак (200 мл), жидкость B5 с ниацинамидом (120 мл), цифровой термометр и светящийся добавок OOTDART',
                store: 'Temu / Почта',
                trackingNumber: 'RU002884047Z5',
                orderDate: '19.09.2026',
                expectedDate: 'В пути в вашу страну',
                status: 'transit',
                icon: 'fa-flask',
                progressStep: 2
            },
            {
                id: '5',
                title: 'Набор для свечей, гелевый воск, форма «Сердце» и спрей с кистью',
                description: 'Стеклянные вазочки (4 шт), силиконовая форма «Сердце», гелевый воск (500г), спрей для снятия с формы (150мл) + кисть',
                store: 'Temu',
                trackingNumber: 'TMU011357692',
                orderDate: '23.09.2026',
                expectedDate: 'В пути',
                status: 'transit',
                icon: 'fa-spray-can',
                progressStep: 2
            },
            {
                id: '4',
                title: 'Бусины-разделители для ювелирных изделий (2 мм)',
                description: 'Бусины-разделители серебристые (2000 шт) и бронзовые (2000 шт) для изготовления украшений',
                store: 'AliExpress',
                trackingNumber: 'RS13360288896Y',
                orderDate: '13.09.2026',
                expectedDate: '23.09 - 05.10',
                status: 'transit',
                icon: 'fa-cubes',
                progressStep: 2
            },
            {
                id: '3',
                title: 'Декоративные бусины, формы и основа для воска',
                description: 'Декоративные бусины, формы для свечей, основа для воска',
                store: 'Temu',
                trackingNumber: 'TMU011319337',
                orderDate: '11.09.2026',
                expectedDate: 'Получено',
                status: 'delivered',
                icon: 'fa-gem',
                progressStep: 4
            },
            {
                id: '2',
                title: 'Гелевый воск для свечей (Jelly Wax)',
                description: 'Воск для изготовления свечей (50/100/200/500г)',
                store: 'AliExpress / Почта',
                trackingNumber: 'RN0041865636Y',
                orderDate: '12.09.2026',
                expectedDate: 'Получено',
                status: 'delivered',
                icon: 'fa-fire-flame-curved',
                progressStep: 4
            },
            {
                id: '1',
                title: 'Формы и материалы для рукоделия',
                description: 'Формы и аксессуары для свечей и поделок',
                store: 'AliExpress / Почта',
                trackingNumber: 'RN0041809876Y',
                orderDate: '11.09.2026',
                expectedDate: 'Получено',
                status: 'delivered',
                icon: 'fa-shapes',
                progressStep: 4
            }
        ];

        let orders = [];
        let currentStatusFilter = 'all';

        // Load and Save Logic
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('my_shipments_v2');
            if (saved) {
                try {
                    orders = JSON.parse(saved);
                } catch(e) {
                    orders = [...defaultOrders];
                }
            } else {
                orders = [...defaultOrders];
            }
            renderOrders();
        });

        function saveToStorage() {
            localStorage.setItem('my_shipments_v2', JSON.stringify(orders));
        }

        // Search Input Handlers
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderOrders();
        }

        function setStatusFilter(filter) {
            currentStatusFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-xs');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });

            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
                activeBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-xs');
            }

            renderOrders();
        }

        // Render Cards List
        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const storeVal = document.getElementById('storeFilter').value.toLowerCase();
            
            // Clear search button visibility
            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchVal.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            // Update Statistics
            const totalCount = orders.length;
            const transitCount = orders.filter(o => o.status === 'transit').length;
            const deliveredCount = orders.filter(o => o.status === 'delivered').length;

            document.getElementById('stat-total').innerText = totalCount;
            document.getElementById('stat-transit').innerText = transitCount;
            document.getElementById('stat-delivered').innerText = deliveredCount;

            document.getElementById('count-all').innerText = totalCount;
            document.getElementById('count-transit').innerText = transitCount;
            document.getElementById('count-delivered').innerText = deliveredCount;

            // Filter logic
            const filtered = orders.filter(item => {
                const matchesStatus = (currentStatusFilter === 'all') || (item.status === currentStatusFilter);
                
                let matchesStore = true;
                if (storeVal === 'temu') matchesStore = item.store.toLowerCase().includes('temu');
                if (storeVal === 'ali') matchesStore = item.store.toLowerCase().includes('ali');

                const matchesSearch = (item.title && item.title.toLowerCase().includes(searchVal)) || 
                                      (item.description && item.description.toLowerCase().includes(searchVal)) || 
                                      (item.store && item.store.toLowerCase().includes(searchVal)) ||
                                      (item.trackingNumber && item.trackingNumber.toLowerCase().includes(searchVal));

                return matchesStatus && matchesStore && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            } else {
                document.getElementById('emptyState').classList.add('hidden');
            }

            container.innerHTML = filtered.map(order => createOrderCardHtml(order)).join('');
        }

        // Create Individual HTML Card
        function createOrderCardHtml(order) {
            const isDelivered = order.status === 'delivered';

            // Store Pill Badge Color
            let storeBadge = 'bg-slate-800 text-white';
            if (order.store.toLowerCase().includes('ali')) storeBadge = 'bg-red-600 text-white';
            else if (order.store.toLowerCase().includes('temu')) storeBadge = 'bg-orange-500 text-white';

            // Status Badge Colors
            let statusBadge = 'bg-amber-50 text-amber-700 border-amber-200';
            let statusText = '🚚 В пути';
            if (isDelivered) {
                statusBadge = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                statusText = '✅ Доставлено';
            }

            // Progress Timeline percentage
            let progressPercent = order.status === 'delivered' ? '100%' : '50%';
            let step1Color = 'bg-emerald-500 text-white';
            let step2Color = 'bg-emerald-500 text-white';
            let step3Color = isDelivered ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-500';

            return `
                <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 overflow-hidden transition-all duration-200 hover:shadow-md animate-fade-in">
                    <!-- Top Header Bar -->
                    <div class="px-4 py-2.5 bg-slate-50/60 border-b border-slate-100 flex items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-0.5 rounded-full font-bold border ${statusBadge}">
                                ${statusText}
                            </span>
                            ${order.orderDate ? `<span class="text-slate-400 font-medium">Заказ от ${escapeHtml(order.orderDate)}</span>` : ''}
                        </div>

                        <span class="font-bold ${storeBadge} px-2.5 py-0.5 rounded-md text-[11px] tracking-wide">
                            ${escapeHtml(order.store)}
                        </span>
                    </div>

                    <div class="p-4 space-y-3">
                        <!-- Main Item Title & Icon -->
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-xl ${isDelivered ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-amber-50 text-amber-600 border-amber-100'} border flex-shrink-0 flex items-center justify-center text-lg">
                                <i class="fa-solid ${order.icon || 'fa-box'}"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-xs sm:text-sm font-bold text-slate-900 leading-snug">${escapeHtml(order.title)}</h3>
                                ${order.description ? `<p class="text-xs text-slate-500 mt-1 leading-relaxed">${escapeHtml(order.description)}</p>` : ''}
                            </div>
                        </div>

                        <!-- Delivery Progress Visualizer Bar -->
                        <div class="pt-2 pb-1">
                            <div class="relative w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mb-2">
                                <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500" style="width: ${progressPercent}"></div>
                            </div>
                            <div class="flex justify-between items-center text-[11px] text-slate-400 font-medium">
                                <span class="flex items-center gap-1 text-emerald-600 font-semibold">
                                    <i class="fa-solid fa-circle-check"></i> Оформлено
                                </span>
                                <span class="flex items-center gap-1 ${order.status === 'transit' ? 'text-amber-600 font-bold' : 'text-emerald-600'}">
                                    <i class="fa-solid fa-plane-departure"></i> В пути
                                </span>
                                <span class="flex items-center gap-1 ${isDelivered ? 'text-emerald-600 font-bold' : ''}">
                                    <i class="fa-solid fa-house"></i> Вручено
                                </span>
                            </div>
                        </div>

                        <!-- Tracking Number Bar & Copy Action -->
                        <div class="flex items-center justify-between bg-slate-50 rounded-xl p-2.5 border border-slate-200/60 text-xs">
                            <div class="flex items-center gap-2">
                                <span class="text-slate-400 font-medium">Трек-номер:</span>
                                <strong class="font-mono font-bold text-slate-800 text-xs sm:text-sm tracking-wide">${escapeHtml(order.trackingNumber)}</strong>
                            </div>

                            <div class="flex items-center gap-1">
                                <button onclick="copyTracking('${order.trackingNumber}')" class="px-2.5 py-1 bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-lg font-semibold flex items-center gap-1 transition active:scale-95 shadow-2xs" title="Скопировать">
                                    <i class="fa-regular fa-copy text-emerald-600"></i>
                                    <span class="hidden sm:inline">Копировать</span>
                                </button>
                                <a href="https://israelpost.co.il" target="_blank" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg" title="Открыть сайт почты">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Copy Tracking Helper
        function copyTracking(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast('Трек-номер скопирован в буфер!');
        }

        // Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // Modal Handlers
        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function handleAddPackage(e) {
            e.preventDefault();
            const newObj = {
                id: Date.now().toString(),
                title: document.getElementById('newTitle').value,
                description: document.getElementById('newDescription').value,
                store: document.getElementById('newStore').value,
                orderDate: document.getElementById('newOrderDate').value || 'Сегодня',
                trackingNumber: document.getElementById('newTracking').value,
                status: document.getElementById('newStatus').value,
                icon: 'fa-box',
                progressStep: document.getElementById('newStatus').value === 'delivered' ? 4 : 2
            };

            orders.unshift(newObj);
            saveToStorage();
            renderOrders();
            closeAddModal();
            showToast('Новая посылка добавлена!');
            document.getElementById('addPackageForm').reset();
        }

        // Helper string escaper
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
